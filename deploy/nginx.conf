# 本机部署验收示例；服务器部署时替换 upstream 地址，并配置正式HTTPS证书。
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    # 认证接口按来源地址限流；空key不计入普通业务请求。
    map $uri $auth_limit_key {
        default "";
        ~^/api/login(?:/(?:code|register|reset-password))?$ $binary_remote_addr;
    }
    limit_req_zone $auth_limit_key zone=auth:10m rate=30r/m;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # 与IDEA和Spring Boot默认端口保持一致；后端改端口时需同步这里并重载Nginx。
    upstream library_api { server host.docker.internal:8080; }
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 12m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Vue history 路由刷新由同一入口接管。
        location / { try_files $uri $uri/ /index.html; }
        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
        # 尾部斜杠移除/api前缀，HTTP与WebSocket共用代理。
        location /api/ {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://library_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # AI流式回答不得被代理聚合，读超时长于浏览器125秒总上限。
            proxy_buffering off;
            proxy_read_timeout 130s;
            add_header Cache-Control "no-store";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
    }
}
